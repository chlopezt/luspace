name: Publicar LuSpace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Preparar D1, R2 y configuracion
        shell: bash
        run: |
          set -euo pipefail
          # Never select the first database: previews have independent databases.
          D1_ID="853a2ab9-2950-4be8-8aec-4350cd7dd8a0"
          sed "s/REEMPLAZAR_CON_DATABASE_ID/$D1_ID/" wrangler.toml > wrangler.deploy.toml
          echo "D1_ID=$D1_ID"
          if ! npx wrangler r2 bucket info luspace-files && ! npx wrangler r2 bucket create luspace-files; then
            echo "R2 pendiente de activar en Cloudflare; se publica la aplicacion sin archivos adjuntos."
            sed '/^\[\[r2_buckets\]\]/,/^$/d' wrangler.deploy.toml > wrangler.pages.toml
            mv wrangler.pages.toml wrangler.deploy.toml
          fi
      - run: npx wrangler d1 migrations apply luspace-db --remote --config wrangler.deploy.toml
      - run: npx wrangler pages project create luspace-app --production-branch main || true
      - run: cp wrangler.deploy.toml wrangler.toml && npx wrangler pages deploy dist --project-name luspace-app --branch main --commit-dirty=true
