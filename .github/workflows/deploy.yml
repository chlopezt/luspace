name: Publicar LuSpace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Preparar D1, R2 y configuracion
        shell: bash
        run: |
          set -euo pipefail
          D1_ID="$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s).find(d=>d.name==="luspace-db");process.stdout.write(x?.uuid||"")})')"
          if [ -z "$D1_ID" ]; then D1_ID="$(npx wrangler d1 create luspace-db --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).uuid))')"; fi
          if ! npx wrangler r2 bucket list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.exit(JSON.parse(s).some(b=>b.name==="luspace-files")?0:1))'; then npx wrangler r2 bucket create luspace-files; fi
          sed "s/REEMPLAZAR_CON_DATABASE_ID/$D1_ID/" wrangler.toml > wrangler.deploy.toml
      - run: npx wrangler d1 migrations apply luspace-db --remote --config wrangler.deploy.toml
      - run: npx wrangler pages project create luspace-app --production-branch main || true
      - run: npx wrangler pages deploy dist --project-name luspace-app --branch main --commit-dirty=true --config wrangler.deploy.toml

