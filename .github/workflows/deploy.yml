name: Publicar LuSpace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Preparar D1, R2 y configuracion
        shell: bash
        run: |
          set -euo pipefail
          D1_OUTPUT="$(npx wrangler d1 info luspace-db)"
          D1_ID="$(printf '%s\n' "$D1_OUTPUT" | sed -n 's/^database_id = "\(.*\)"/\1/p')"
          test -n "$D1_ID"
          npx wrangler r2 bucket create luspace-files || echo "R2 pendiente de activar en Cloudflare; se publica la aplicacion sin archivos adjuntos."
          sed "s/REEMPLAZAR_CON_DATABASE_ID/$D1_ID/" wrangler.toml > wrangler.deploy.toml
      - run: npx wrangler d1 migrations apply luspace-db --remote --config wrangler.deploy.toml
      - run: npx wrangler pages project create luspace-app --production-branch main || true
      - run: npx wrangler pages deploy dist --project-name luspace-app --branch main --commit-dirty=true --config wrangler.deploy.toml

