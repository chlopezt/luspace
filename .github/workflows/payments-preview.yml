name: Pruebas aisladas de pagos

on:
  push:
    branches: [payments-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payments-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.ref == 'refs/heads/payments-preview'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b82d9c355fea7fa6d20ed89e2b3971fa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Preparar solamente la base de pruebas
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 list --json --config /dev/null > /tmp/preview-databases.json
          DB_ID=$(node -e 'const a=JSON.parse(require("fs").readFileSync("/tmp/preview-databases.json","utf8"));const d=a.filter(x=>x.name==="luspace-payments-preview-db");if(d.length>1)process.exit(1);process.stdout.write(d[0]?.uuid||d[0]?.id||"")')
          if [ -z "$DB_ID" ]; then
            node -e 'const a=JSON.parse(require("fs").readFileSync("/tmp/preview-databases.json","utf8"));if(a.length>=10)throw Error("No hay capacidad en el límite gratuito de 10 bases. No se cambia el plan.")'
            npx wrangler d1 create luspace-payments-preview-db --config /dev/null
            npx wrangler d1 list --json --config /dev/null > /tmp/preview-databases.json
            DB_ID=$(node -e 'const a=JSON.parse(require("fs").readFileSync("/tmp/preview-databases.json","utf8"));const d=a.filter(x=>x.name==="luspace-payments-preview-db");if(d.length!==1)process.exit(1);process.stdout.write(d[0].uuid||d[0].id)')
          fi
          test -n "$DB_ID"
          test "$DB_ID" != "853a2ab9-2950-4be8-8aec-4350cd7dd8a0"
          sed "s/REEMPLAZAR_PREVIEW_DATABASE_ID/$DB_ID/" wrangler.payments.toml > wrangler.toml
          npx wrangler d1 migrations apply luspace-payments-preview-db --remote --config wrangler.toml
      - name: Publicar proyecto independiente, sin R2 ni IA
        run: |
          npx wrangler pages project create luspace-payments-preview --production-branch payments-preview || npx wrangler pages project list
          npx wrangler pages deploy dist --project-name luspace-payments-preview --branch payments-preview --commit-dirty=true
