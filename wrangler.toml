name = "luspace-app"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[ai]
binding = "AI"

[vars]
LUSPACE_AI_ENABLED = "true"
LUSPACE_R2_ENABLED = "true"
LUSPACE_REGISTRATION_ENABLED = "true"
LUSPACE_BILLING_MODE = "production"
# Enabled after owner price approval, verified seller/job and signed production Webhook simulation.
LUSPACE_BILLING_LIVE_APPROVED = "true"
LUSPACE_BILLING_AMOUNT_CLP = "5938"
MP_SELLER_ID = "146906297"
MP_APPLICATION_ID = "3897124361346197"
MP_BILLING_BACK_URL = "https://luspace.cl/login"

[[d1_databases]]
binding = "DB"
database_name = "luspace-db"
database_id = "REEMPLAZAR_CON_DATABASE_ID"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "luspace-files"

