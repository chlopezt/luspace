name = "luspace-app"
compatibility_date = "2026-10-01"
pages_build_output_dir = "dist"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "luspace-db"
database_id = "REEMPLAZAR_CON_DATABASE_ID"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "luspace-files"
